name: "\u23F0 Weekly Database SQL Backup to Discord"

on:
  schedule:
    # Berjalan otomatis setiap hari Minggu pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions

jobs:
  backup:
    name: Backup Database & Send to Discord
    runs-on: ubuntu-latest

    steps:
      - name: "\uD83D\uDE80 Fetch Supabase Data & Send SQL Backup to Discord"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e

          # Validasi secret
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Secret belum lengkap! Pastikan SUPABASE_URL, SUPABASE_ANON_KEY, dan DISCORD_WEBHOOK_URL sudah diisi di GitHub Secrets."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"
          DATE_STR=$(date -u +"%Y-%m-%d")
          TIME_STR=$(TZ="Asia/Jakarta" date +"%H:%M:%S")
          FILENAME="backup_weekly_absensi_${DATE_STR}.sql"

          echo "📥 Fetching data from Supabase..."

          # Fetch users data
          USERS=$(curl -s -X GET "${CLEAN_URL}/rest/v1/users?select=*" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          # Fetch absensi data
          ABSENSI=$(curl -s -X GET "${CLEAN_URL}/rest/v1/absensi?select=*" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          # Count records
          USER_COUNT=$(echo "$USERS" | python3 -c "import sys,json; data=json.load(sys.stdin); print(len(data))" 2>/dev/null || echo "0")
          ABSENSI_COUNT=$(echo "$ABSENSI" | python3 -c "import sys,json; data=json.load(sys.stdin); print(len(data))" 2>/dev/null || echo "0")

          echo "✅ Fetched: ${USER_COUNT} users, ${ABSENSI_COUNT} absensi records"

          # Generate SQL backup file using Python
          python3 << 'PYEOF'
          import json, os, sys

          users_json = os.environ.get("USERS", "[]")
          absensi_json = os.environ.get("ABSENSI", "[]")

          try:
              users = json.loads(users_json)
          except:
              users = []

          try:
              absensi = json.loads(absensi_json)
          except:
              absensi = []

          date_str = os.environ.get("DATE_STR", "unknown")

          sql = f"-- DATABASE WEEKLY BACKUP (GitHub Actions Scheduled)\n"
          sql += f"-- Date: {date_str}\n"
          sql += f"-- Generated automatically by GitHub Actions\n\n"

          def esc(val):
              if val is None:
                  return ""
              return str(val).replace("'", "''")

          if users:
              sql += "-- USERS TABLE\n"
              sql += "INSERT INTO users (id, nama, pin, role, sekolah, tempat_magang, no_hp, foto_profil) VALUES\n"
              vals = []
              for u in users:
                  vals.append(f"('{esc(u.get('id'))}', '{esc(u.get('nama'))}', '{esc(u.get('pin'))}', '{esc(u.get('role'))}', '{esc(u.get('sekolah'))}', '{esc(u.get('tempat_magang'))}', '{esc(u.get('no_hp'))}', '{esc(u.get('foto_profil'))}')")
              sql += ",\n".join(vals) + "\nON CONFLICT (id) DO NOTHING;\n\n"

          if absensi:
              sql += "-- ABSENSI TABLE\n"
              sql += "INSERT INTO absensi (id, student_id, nama_siswa, tanggal, jam_masuk, keterangan_masuk, jam_pulang, keterangan_pulang, status, latitude, longitude, jarak_meters, status_lokasi) VALUES\n"
              vals = []
              for a in absensi:
                  lat = a.get('latitude') or 'NULL'
                  lng = a.get('longitude') or 'NULL'
                  jarak = a.get('jarak_meters') or 0
                  vals.append(f"('{esc(a.get('id'))}', '{esc(a.get('student_id'))}', '{esc(a.get('nama_siswa'))}', '{esc(a.get('tanggal'))}', '{esc(a.get('jam_masuk','-'))}', '{esc(a.get('keterangan_masuk','-'))}', '{esc(a.get('jam_pulang','-'))}', '{esc(a.get('keterangan_pulang','-'))}', '{esc(a.get('status','Hadir'))}', {lat}, {lng}, {jarak}, '{esc(a.get('status_lokasi','Di Area Magang'))}')")
              sql += ",\n".join(vals) + "\nON CONFLICT (id) DO NOTHING;\n\n"

          filename = os.environ.get("FILENAME", "backup.sql")
          with open(filename, "w", encoding="utf-8") as f:
              f.write(sql)

          print(f"📄 SQL backup file created: {filename} ({len(sql)} bytes)")
          PYEOF

          echo "📤 Sending backup to Discord..."

          # Build Discord embed payload JSON
          PAYLOAD_JSON=$(python3 -c "
          import json, os
          payload = {
              'content': '⏰ **[AUTO 7-DAYS BACKUP] Backup Otomatis Mingguan Berhasil Dieksekusi!**',
              'embeds': [{
                  'title': '📦 GitHub Actions Scheduled Backup - PT. Multi Power Abadi',
                  'description': 'Backup otomatis database mingguan dijalankan oleh GitHub Actions. File .sql terlampir di bawah ini.',
                  'color': 5793266,
                  'fields': [
                      {'name': '📅 Waktu Eksekusi', 'value': '${DATE_STR} ${TIME_STR} WIB', 'inline': True},
                      {'name': '👥 Total Siswa Terdata', 'value': '${USER_COUNT} Siswa', 'inline': True},
                      {'name': '📝 Total Data Absensi', 'value': '${ABSENSI_COUNT} Baris', 'inline': True},
                      {'name': '🤖 Trigger', 'value': 'GitHub Actions Cron (7 Hari)', 'inline': True}
                  ],
                  'footer': {'text': 'Sistem Otomatis Absensi Magang • PT. Multi Power Abadi'}
              }]
          }
          print(json.dumps(payload))
          ")

          # Send to Discord with file attachment
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -F "files[0]=@${FILENAME}" \
            -F "payload_json=${PAYLOAD_JSON}" \
            "${DISCORD_WEBHOOK_URL}")

          echo "Discord webhook response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "✅ Backup berhasil dikirim ke Discord!"
          else
            echo "::error::Gagal mengirim backup ke Discord (HTTP $HTTP_STATUS)"
            exit 1
          fi
